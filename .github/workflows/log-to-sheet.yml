name: Log release push to Google Sheet

on:
  push:
    branches:
      - 'release-*/**'

jobs:
  log:
    runs-on: ubuntu-latest
    # Skip branch deletions (they have no commit)
    if: ${{ !github.event.deleted }}
    steps:
      - name: Check branch pattern (release-1 to release-99)
        id: check
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$BRANCH" =~ ^release-[0-9]{1,2}/ ]]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "Branch '$BRANCH' does not match ^release-\d{1,2}/ - skipping"
          fi

      - name: Send to Google Sheet
        if: steps.check.outputs.match == 'true'
        env:
          SHEET_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          TOKEN: ${{ secrets.SHEET_TOKEN }}
          REPO: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT: ${{ github.event.head_commit.message }}
        run: |
          RESPONSE=$(jq -n \
              --arg token "$TOKEN" --arg repo "$REPO" --arg branch "$BRANCH" \
              --arg author "$AUTHOR" --arg commit "$COMMIT" \
              '{token:$token, repo:$repo, branch:$branch, author:$author, commit:$commit}' \
            | curl -sSL -X POST -H "Content-Type: application/json" -d @- "$SHEET_URL")
          echo "Response: $RESPONSE"
          # Fail the job if the script reports an error
          [[ "$RESPONSE" == ok* || "$RESPONSE" == skipped* ]]
